<!doctype html>
<html lang="ru" data-site="dtf" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Редактор DTF</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="assets/original/64.css">
  <link rel="stylesheet" href="assets/original/66.css">
  <link rel="stylesheet" href="compact.css">
  <link rel="stylesheet" href="editor-reference.css">
  <link rel="stylesheet" href="editor.css">
  <script defer src="compact.js"></script>
  <script defer src="editor.js"></script>
</head>
<body class="audio-editor">
  <iframe class="editor-underlay" src="index.html" title="Пост" tabindex="-1" inert aria-hidden="true"></iframe>
  <div class="modal-fullpage" id="editor-modal" role="dialog" aria-modal="true" aria-label="Редактор поста">
    <div class="modal-fullpage__inner">
      <div class="modal-fullpage__controls">
        <button type="button" class="xyOaXyd-" id="editor-maximize" aria-label="Развернуть редактор" aria-pressed="false"><svg class="icon" width="22" height="22" aria-hidden="true"><use href="assets/sprite.svg#sprite-maximize"></use></svg></button>
        <a class="xyOaXyd-" href="index.html" aria-label="Закрыть редактор"><svg class="icon" width="22" height="22" aria-hidden="true"><use href="assets/sprite.svg#sprite-cross"></use></svg></a>
      </div>
      <main class="editor">
        <header class="editor-topic-picker">
          <div class="editor-topic-picker__inner">
            <div class="author">
              <img class="editor-avatar" src="assets/editor-author.webp" width="40" height="40" alt="">
              <div class="author__main">
                <div class="author__name">Райнер Браун</div>
                <div class="author__details"><span class="editor-topic-picker__topic">Без темы <svg class="icon" width="17" height="17" aria-hidden="true"><use href="assets/sprite.svg#sprite-chevron_down"></use></svg></span></div>
              </div>
            </div>
          </div>
        </header>
        <div class="editor__body">
          <div class="paragraph-wrapper">
            <div class="codex-editor">
              <div class="ce-redactor">
                <div class="ce-block">
                  <div class="ce-block__content">
                    <div class="editor-header-tool editor-header-tool--h2">
                      <div id="editor-title" contenteditable="true" role="textbox" aria-label="Заголовок" aria-multiline="true" data-placeholder="Заголовок" class="editor-tool-input editor-tool-input--multiline editor-tool-input--text-lg editor-tool-input--with-limit"><p>Тест</p></div>
                    </div>
                  </div>
                </div>
                <div class="ce-block">
                  <div class="ce-block__content">
                    <div class="editor-audio-tool" id="editor-audio" aria-label="Аудиоблок">
                      <div class="editor-audio-actions">
                        <button type="button" class="icon-button editor-audio-settings" id="audio-settings" aria-label="Настройки аудиоблока" aria-controls="audio-settings-menu" aria-expanded="false"><span class="editor-block-grip" aria-hidden="true"></span></button>
                        <div class="editor-block-menu" id="audio-settings-menu" hidden>
                          <button type="button" id="audio-replace"><svg class="icon" width="24" height="24" aria-hidden="true"><use href="assets/sprite.svg#sprite-refresh"></use></svg>Заменить файл</button>
                          <button type="button" id="audio-remove"><svg class="icon" width="24" height="24" aria-hidden="true"><use href="assets/sprite.svg#sprite-delete"></use></svg>Удалить блок</button>
                        </div>
                      </div>
                      <div id="audio-pick">
                        <button type="button" class="button button--size-l button--type-minimal button--with-icon button--rounded" id="audio-choose"><svg class="icon" width="24" height="24" aria-hidden="true"><use href="assets/sprite.svg#sprite-plus"></use></svg>Добавить аудио</button>
                      </div>
                      <input type="file" id="audio-file" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus" hidden>
                      <p id="audio-error" class="editor-audio-error" role="alert" hidden></p>
                      <div id="audio-player-shell" class="editor-audio-player-shell" hidden>
                        <div class="compact-player" id="compact-player" data-inline-only><button class="cp-play" id="cp-play" data-control="cp-play" aria-label="Воспроизвести"><img src="assets/final-play.svg" alt=""></button><button type="button" class="cp-timers cp-timer-toggle" aria-label="Текущее время. Показать общую длительность"><span class="cp-time" id="cp-time" data-control="cp-time">00:00</span><span class="cp-time-divider"> / </span><span class="cp-duration" id="cp-duration" data-control="cp-duration">—:—</span></button><div class="cp-wave" id="cp-wave" data-control="cp-wave"><canvas id="cp-canvas" data-control="cp-canvas"></canvas><input id="cp-seek" data-control="cp-seek" type="range" min="0" max="1000" value="0" aria-label="Перемотка"><span class="cp-tooltip" id="cp-tooltip" data-control="cp-tooltip">0:00</span></div><div class="cp-volume"><button id="cp-mute" data-control="cp-mute" class="cp-icon" aria-label="Выключить звук"><img src="assets/final-volume.svg" alt=""></button><input id="cp-volume" data-control="cp-volume" type="range" min="0" max="1" step="0.01" value="0.75" aria-label="Громкость"></div><div class="cp-speed-wrap"><button class="cp-speed" id="cp-speed" data-control="cp-speed" aria-label="Скорость воспроизведения" aria-expanded="false" title="Скорость: 1×"><img src="assets/final-speed.svg" alt=""></button><div class="cp-menu" id="cp-menu" data-control="cp-menu" hidden><span>Скорость</span><button data-rate="0.75">0.75×</button><button data-rate="1" class="selected">1×</button><button data-rate="1.25">1.25×</button><button data-rate="1.5">1.5×</button><button data-rate="2">2×</button></div></div><audio id="cp-audio" data-control="cp-audio" preload="metadata"></audio><span class="cp-error" id="cp-error" data-control="cp-error" role="status" hidden></span></div>
                        <div id="audio-upload" class="editor-upload" role="status" aria-label="Загрузка аудио" hidden>
                          <span class="editor-upload-spinner" aria-hidden="true"></span>
                        </div>
                      </div>
                    </div>
                    <div class="editor-insert-row" id="editor-insert-row" hidden>
                      <button type="button" class="icon-button" id="editor-insert" aria-label="Добавить блок" aria-controls="editor-block-menu" aria-expanded="false"><svg class="icon" width="24" height="24" aria-hidden="true"><use href="assets/sprite.svg#sprite-plus"></use></svg></button>
                      <div id="editor-block-menu" class="editor-block-menu" hidden>
                        <span>Выбор блока</span>
                        <button type="button" id="editor-audio-option"><svg class="icon" width="22" height="22" aria-hidden="true"><use href="assets/sprite.svg#sprite-audio"></use></svg>Аудио</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <footer class="editor-control-bar">
          <div class="editor-control-bar__controls">
            <button type="button" class="button button--size-l button--type-primary button--rounded" aria-disabled="true">Опубликовать</button>
            <div class="editor-commenting-permissions"><button class="icon-button" type="button" aria-label="Настройки комментариев" aria-disabled="true"><svg class="icon" width="24" height="24" aria-hidden="true"><use href="assets/sprite.svg#sprite-comment"></use></svg></button></div>
            <div class="etc"><button class="icon-button" type="button" aria-label="Ещё" aria-disabled="true"><svg class="icon" width="24" height="24" aria-hidden="true"><use href="assets/sprite.svg#sprite-dots"></use></svg></button></div>
          </div>
        </footer>
      </main>
    </div>
  </div>
</body>
</html>
